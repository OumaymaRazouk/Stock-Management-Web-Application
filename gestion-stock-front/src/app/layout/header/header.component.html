<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm border-bottom">
  <div class="container-fluid">
    <span class="navbar-brand fw-bold text-primary">
      <i class="bi bi-speedometer2 me-2"></i>
      Tableau de bord - Gestion de stock
    </span>

    <div class="d-flex align-items-center ms-auto">

      <!-- Notifications -->
      <div class="nav-item dropdown">
        <a class="nav-link position-relative notification-bell" href="#"
           id="stockAlertDropdown" role="button"
           data-bs-toggle="dropdown" aria-expanded="false" (click)="toggleDropdown($event)">
          <i class="bi bi-bell-fill text-muted"></i>
          <span *ngIf="articlesCritiques.length > 0" class="notification-badge">
            {{ articlesCritiques.length }}
          </span>
        </a>

        <div class="dropdown-menu dropdown-menu-end notification-dropdown"
             [class.show]="isDropdownOpen"
             aria-labelledby="stockAlertDropdown">

          <div class="notification-header">
            <i class="bi bi-exclamation-triangle text-warning me-2"></i>
            Alertes Stock ({{ articlesCritiques.length }})
          </div>

          <div class="notification-scroll-area">
            <div *ngIf="articlesCritiques.length === 0" class="notification-empty">
              <i class="bi bi-check-circle text-success me-2"></i>
              Aucune alerte de stock
            </div>

            <div *ngFor="let article of articlesCritiques" class="notification-item">
               <!-- ... Contenu de l'item de notification ... -->
               <div class="d-flex align-items-start">
                 <div class="notification-icon me-3">
                   <i class="bi" [ngClass]="{
                     'bi-x-circle-fill text-danger': article.statutStock === 'RUPTURE',
                     'bi-exclamation-triangle-fill text-warning': article.statutStock === 'FAIBLE'
                   }"></i>
                 </div>
                 <div class="notification-content">
                   <div class="fw-semibold">{{ article.reference }}</div>
                   <div class="text-muted small">{{ article.description }}</div>
                   <div class="notification-status">
                     <span [ngClass]="{
                       'badge bg-danger': article.statutStock === 'RUPTURE',
                       'badge bg-warning text-dark': article.statutStock === 'FAIBLE'
                     }">
                       {{ article.statutStock }}
                     </span>
                   </div>
                 </div>
               </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Séparateur Vertical -->
      <div class="vr mx-3"></div>

      <!-- Bouton de déconnexion -->
      <button class="btn btn-outline-danger d-flex align-items-center" (click)="logout()">
        <i class="bi bi-box-arrow-right me-2"></i>
        <span>Déconnexion</span>
      </button>

    </div>
  </div>
</nav>
