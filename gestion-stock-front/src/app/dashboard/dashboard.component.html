<div class="container-fluid bg-light min-vh-100 p-4">


  <div *ngIf="loading" class="text-center mb-4">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Chargement...</span>
    </div>
  </div>

  <p *ngIf="error" class="alert alert-warning" role="alert">{{ error }}</p>
  <div class="row g-4">
    <div class="col-md-4" *ngFor="let card of cards">
      <div class="card text-white bg-{{ card.color }} shadow h-100">
        <div class="card-body d-flex flex-column justify-content-between">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h5 class="card-title">{{ card.title }}</h5>
              <h3>{{ card.count }}</h3>
            </div>
            <i class="bi bi-{{ card.icon }} display-6"></i>
          </div>
          <a [routerLink]="card.route" class="btn btn-outline-light mt-3">Voir détails</a>
        </div>
      </div>
    </div>
  </div>
</div>
